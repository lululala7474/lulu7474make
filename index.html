<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="description" content="일정, 할 일, 목표, 중요 사항, 일기를 한곳에서 관리하는 개인 생활 플래너">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="하루 플래너">
  <title>하루 플래너</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // 화면이 깜빡이지 않도록 저장된 테마를 먼저 적용
    try {
      var t = localStorage.getItem('haru:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="viewTitle">오늘</h1>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="searchBtn" data-action="nav" data-view="search" aria-label="전체 검색" title="전체 검색"></button>
        <button type="button" class="icon-btn" id="themeBtn" data-action="theme" aria-label="다크/라이트 모드 전환" title="테마 전환"></button>
        <button type="button" class="icon-btn" id="settingsBtn" data-action="nav" data-view="more" aria-label="설정 및 백업" title="설정 · 백업"></button>
      </div>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <button type="button" id="fab" class="fab" data-action="fab" aria-label="새로 추가" hidden></button>

  <nav id="nav" class="nav" aria-label="주요 메뉴"></nav>

  <div id="modal" class="layer" hidden></div>
  <div id="confirm" class="layer layer-confirm" hidden></div>
  <div id="toast" class="toast-wrap" aria-live="polite"></div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <noscript>
    <p style="padding:24px;text-align:center">이 앱을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</p>
  </noscript>

  <script src="script.js" defer></script>
</body>
</html>
