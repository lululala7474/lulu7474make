<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="환율노트">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>환율노트</title>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">환율노트</h1>
    <button id="refresh" aria-label="새로고침">⟳</button>
  </div>
  <div id="status" class="status"></div>
</header>

<main>
  <section id="list-view">
    <div class="tabs" id="list-tabs">
      <button data-p="7" class="on">7일</button><button data-p="30">30일</button>
    </div>
    <div id="overall" class="summary" hidden></div>
    <div id="list"></div>
  </section>

  <section id="detail-view" hidden>
    <button id="back" class="back">‹ 전체 통화</button>
    <div class="tabs" id="detail-tabs">
      <button data-p="7" class="on">7일</button><button data-p="30">30일</button>
    </div>
    <div id="detail"></div>
    <div class="card">
      <h2>📰 관련 뉴스 <small>(최근 7일)</small></h2>
      <div id="news"></div>
    </div>
  </section>
</main>

<footer>환율: 유럽중앙은행(ECB) 기준환율 · Frankfurter API (영업일 기준, 하루 1회 갱신)<br>뉴스: GDELT · 투자 판단의 근거가 아닌 참고용 정보입니다</footer>

<script src="app.js"></script>
</body>
</html>
